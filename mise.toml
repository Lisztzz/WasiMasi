# Herramientas compartidas del repositorio.
# Ejecuta `mise install` desde la raíz una vez: con esto node/npm/npx, java y mvn
# quedan activos automáticamente al entrar a cualquier carpeta del proyecto.

[tools]
node = "24.22.2"          # Web App (Angular 22)
java = "temurin-21"       # Web Services (Spring Boot 4.1)
maven = "3.9.11"          # Gestión de dependencias del backend

[tasks.frontend-install]
description = "Instalar dependencias de la Web App"
dir = "frontend"
run = "npm install"

[tasks.frontend-build]
description = "Verificar que la Web App compile"
dir = "frontend"
run = "npx ng build"

[tasks.frontend-serve]
description = "Levantar la Web App en http://localhost:4200"
dir = "frontend"
run = "npx ng serve"

[tasks.frontend-test]
description = "Ejecutar los tests unitarios de la Web App (Vitest)"
dir = "frontend"
run = "npx ng test --watch=false"

[tasks.backend-compile]
description = "Compilar el backend"
dir = "backend"
run = "mvn compile"

[tasks.backend-test]
description = "Ejecutar los tests unitarios del backend (JUnit)"
dir = "backend"
run = "mvn test"

[tasks.backend-run]
description = "Levantar la API en http://localhost:8080/api"
dir = "backend"
run = "mvn spring-boot:run"
