<h2 mat-dialog-title>{{ 'mensajes.contacto' | t: { nombre: publicacion.anfitrionNombre } }}</h2>

<form (submit)="enviar($event)">
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>{{ 'mensajes.texto' | t }}</mat-label>
      <textarea matInput [formControl]="mensaje" [maxlength]="maximo" [readOnly]="enviando()" rows="5"></textarea>
      <mat-hint align="end">{{ mensaje.value.length }}/{{ maximo }}</mat-hint>
    </mat-form-field>
    @if (error(); as aviso) {
      <p role="alert">{{ aviso }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close [disabled]="enviando()">{{ 'mensajes.cancelar' | t }}</button>
    <button mat-flat-button type="submit" [disabled]="!puedeEnviar()">
      {{ (enviando() ? 'mensajes.enviando' : 'mensajes.enviar') | t }}
    </button>
  </mat-dialog-actions>
</form>
