server:
  servlet:
    context-path: /api

spring:
  application:
    name: wasimasi-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wasimasi}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  ai:
    openai:
      # US21 - Agente de IA. Groq ofrece una API compatible con OpenAI (gratuita para el proyecto).
      # La clave va SOLO en la variable de entorno GROQ_API_KEY; nunca se sube al repositorio.
      api-key: ${GROQ_API_KEY:sin-configurar}
      base-url: ${WASIMASI_IA_BASE_URL:https://api.groq.com/openai/v1}
      chat:
        # Modelo con buen manejo de herramientas en Groq (llama-3.3-70b-versatile fue retirado).
        model: ${WASIMASI_IA_MODELO:openai/gpt-oss-120b}
        temperature: 0.2
        # gpt-oss devuelve su razonamiento; Groq rechaza que se le reenvíe en el historial (HTTP 400).
        replay-reasoning-content: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

wasimasi:
  dominios-institucionales: upc.edu.pe,pucp.edu.pe,unmsm.edu.pe
  jwt:
    # Clave para firmar los tokens (HS256): minimo 32 caracteres.
    # En produccion se define con la variable de entorno WASIMASI_JWT_SECRET.
    secret: ${WASIMASI_JWT_SECRET:wasimasi-clave-de-desarrollo-cambiar-en-produccion-2026}
    expiracion-minutos: ${WASIMASI_JWT_EXPIRACION_MINUTOS:120}
  cors:
    # Origenes que pueden llamar a la API desde el navegador (Angular y Landing).
    allowed-origins: ${WASIMASI_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:5500,http://localhost:5500}
