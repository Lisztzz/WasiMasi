server:
  servlet:
    context-path: /api

spring:
  application:
    name: wasimasi-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wasimasi}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

wasimasi:
  dominios-institucionales: upc.edu.pe,pucp.edu.pe,unmsm.edu.pe
  jwt:
    # Clave para firmar los tokens (HS256): minimo 32 caracteres.
    # En produccion se define con la variable de entorno WASIMASI_JWT_SECRET.
    secret: ${WASIMASI_JWT_SECRET:wasimasi-clave-de-desarrollo-cambiar-en-produccion-2026}
    expiracion-minutos: ${WASIMASI_JWT_EXPIRACION_MINUTOS:120}
