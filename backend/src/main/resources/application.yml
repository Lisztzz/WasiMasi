server:
  servlet:
    context-path: /api

spring:
  application:
    name: wasimasi-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wasimasi}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

wasimasi:
  dominios-institucionales: upc.edu.pe,pucp.edu.pe,unmsm.edu.pe
